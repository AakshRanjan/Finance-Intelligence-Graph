name: CI FMP-SDK

on:
  pull_request:
    paths:
      - "FMP-SDK/**"
      - ".github/workflows/ci-fmp-sdk.yml"
  push:
    branches: [master]
    paths:
      - "FMP-SDK/**"
      - ".github/workflows/ci-fmp-sdk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FMP-SDK
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version-file: FMP-SDK/.python-version

      - name: Sync
        run: uv sync --locked

      - name: Build
        run: uv build
